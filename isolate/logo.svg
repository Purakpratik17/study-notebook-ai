<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cerevyn launcher emblem: stylized C + open book + gold sparkle + leaf accents on cream -->
  <rect width="512" height="512" rx="96" fill="#FAF5E9"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#0F4C43" stroke-opacity="0.06" stroke-width="10"/>
  <!-- stylized C (dark teal), open at the right -->
  <path d="M 340 118
           A 172 172 0 1 0 340 394
           L 306 340
           A 108 108 0 1 1 306 172
           Z"
        fill="#0F4C43"/>
  <!-- open book -->
  <g fill="#FFFFFF" stroke="#0F4C43" stroke-width="14" stroke-linejoin="round">
    <path d="M 256 300 C 226 276 194 268 162 270 L 162 200 C 194 198 226 206 256 230 Z"/>
    <path d="M 256 300 C 286 276 318 268 350 270 L 350 200 C 318 198 286 206 256 230 Z"/>
  </g>
  <g stroke="#0F4C43" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <line x1="184" y1="222" x2="224" y2="226"/>
    <line x1="184" y1="244" x2="224" y2="248"/>
    <line x1="288" y1="226" x2="328" y2="222"/>
    <line x1="288" y1="248" x2="328" y2="244"/>
  </g>
  <!-- gold sparkle -->
  <path d="M 400 92 L 410 122 L 440 132 L 410 142 L 400 172 L 390 142 L 360 132 L 390 122 Z" fill="#D4A93C"/>
  <path d="M 128 396 L 134 414 L 152 420 L 134 426 L 128 444 L 122 426 L 104 420 L 122 414 Z" fill="#D4A93C" opacity="0.85"/>
  <!-- leaf accents -->
  <path d="M 96 128 C 128 120 152 136 158 164 C 128 172 104 156 96 128 Z" fill="#3E7C59"/>
  <path d="M 416 384 C 384 392 360 376 354 348 C 384 340 408 356 416 384 Z" fill="#3E7C59"/>
</svg>
